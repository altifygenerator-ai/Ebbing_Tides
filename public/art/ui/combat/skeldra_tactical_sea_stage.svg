<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" role="img" aria-label="Skeldran northern tactical sea stage without ships or interface text">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202a31"/>
      <stop offset="0.42" stop-color="#39484f"/>
      <stop offset="0.72" stop-color="#718087"/>
      <stop offset="1" stop-color="#a7a89e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274650"/>
      <stop offset="0.5" stop-color="#17343f"/>
      <stop offset="1" stop-color="#0b202a"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d0be" stop-opacity="0.02"/>
      <stop offset="0.45" stop-color="#e8dfcb" stop-opacity="0.25"/>
      <stop offset="0.58" stop-color="#eadfca" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8d0be" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="cloudNoise" x="-20%" y="-30%" width="140%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.022" numOctaves="4" seed="29"/>
      <feColorMatrix values="1 0 0 0 0.22  0 1 0 0 0.25  0 0 1 0 0.28  0 0 0 .55 0"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="seaNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.07" numOctaves="3" seed="41"/>
      <feColorMatrix values=".35 0 0 0 .04  0 .45 0 0 .08  0 0 .55 0 .1  0 0 0 .38 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <radialGradient id="light" cx="52%" cy="35%" r="48%">
      <stop offset="0" stop-color="#f0dfb8" stop-opacity="0.19"/>
      <stop offset="0.48" stop-color="#d8cba9" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020608" stop-opacity="0.46"/>
      <stop offset="0.14" stop-color="#020608" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#020608" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#020608" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020608" stop-opacity="0.46"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="470" fill="url(#sky)"/>
  <rect y="470" width="1920" height="430" fill="url(#sea)"/>
  <rect width="1920" height="900" fill="url(#light)"/>

